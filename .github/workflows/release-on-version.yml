name: Publish release on version bump

on:
  push:
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write

concurrency:
  group: release-on-version
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -er '.version' manifest.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "manifest.json contains an invalid SemVer version: $version" >&2
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a release; creating the release from it."
            gh release create "$tag" --generate-notes --title "Quickshell Rise $version"
          else
            gh release create "$tag" --target "$GITHUB_SHA" \
              --generate-notes --title "Quickshell Rise $version"
          fi
