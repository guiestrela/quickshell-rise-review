name: Portable CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks (no Wayland session)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run portable checks
        run: bash tests/run-portable-checks.sh
